<!DOCTYPE html>
<html lang="si"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020617">
<title>Alpha Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:#0f172a;--line:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--sky:#38bdf8;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;font-family:Inter,sans-serif}
body{background:radial-gradient(circle at top right,#0f172a,#020617);color:var(--tx);min-height:100vh;padding-top:env(safe-area-inset-top)}
.hidden{display:none!important}
.credit{text-align:center;color:var(--mut);font-size:12px;margin-top:28px;line-height:1.8}.credit b{color:var(--tx)}.credit a{color:var(--sky);text-decoration:none}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}
.brand{text-align:center;margin-bottom:28px}
.brand .a{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#38bdf8,#4f46e5);display:inline-flex;align-items:center;justify-content:center;font:900 30px 'Space Grotesk';color:#020617;box-shadow:0 10px 30px #38bdf840}
.brand h1{font:900 24px 'Space Grotesk';margin-top:12px}.brand p{color:var(--sky);font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700}
input,select{width:100%;background:#1e293b80;border:1px solid #334155;color:var(--tx);border-radius:14px;padding:14px;font-size:15px;outline:none;margin-bottom:12px}
input:focus{border-color:var(--sky)}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;width:100%;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#020617}
.btn:disabled{opacity:.5}
.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
.ok{background:var(--ok);color:#052e16}.bad{background:var(--bad);color:#fff}.ghost{background:#1e293b;color:var(--tx)}
header{position:sticky;top:env(safe-area-inset-top);z-index:5;background:#020617ee;backdrop-filter:blur(12px);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h2{font:900 19px 'Space Grotesk'}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#0f172af2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button span{font-size:20px}nav button.on{color:var(--sky);background:#38bdf814}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{font:900 28px 'Space Grotesk';display:block}.stat small{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t{font-weight:700;font-size:14px}.m{color:var(--mut);font-size:12px;margin-top:2px}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.pending{background:#f59e0b25;color:var(--warn)}.approved,.completed{background:#22c55e25;color:var(--ok)}.rejected,.live{background:#ef444425;color:var(--bad)}.scheduled{background:#38bdf825;color:var(--sky)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600}
.chips button.on{background:var(--sky);color:#020617;border-color:var(--sky)}
h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:6px 0 10px}
.empty{text-align:center;color:var(--mut);padding:36px 0;font-size:13px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--sky);padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;max-width:90%}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
img.slip{width:100%;border-radius:12px;margin:10px 0}
</style></head><body>
<div id="login">
 <div class="brand"><img src="logo.png" alt="Alpha" style="width:150px;height:70px;object-fit:cover;border-radius:16px;background:#fff;box-shadow:0 10px 30px #38bdf840"><h1>Alpha Physics</h1><p>Admin App</p></div>
 <input id="em" type="email" placeholder="Admin email" autocomplete="username">
 <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
 <button class="btn" id="lb" onclick="doLogin()">Log in</button>
 <div class="credit">Developed by <b>OMIDU DEWDITHA</b><br><a href="mailto:hello.omidu@gmail.com">hello.omidu@gmail.com</a></div>
</div>
<div id="app" class="hidden">
 <header><h2 id="ttl">Dashboard</h2><button class="btn ghost sm" onclick="doLogout()">Logout</button></header>
 <main id="main"></main>
 <nav id="nav"></nav>
</div>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,updateDoc,addDoc,deleteDoc,query,where,orderBy,Timestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCQPeZvgYnp10GoZ9FLz2LHsOjreFgS73s",authDomain:"alphaphysics-ab254.firebaseapp.com",projectId:"alphaphysics-ab254",storageBucket:"alphaphysics-ab254.firebasestorage.app",messagingSenderId:"163472927333",appId:"1:163472927333:web:3342c58bfd49799079f48c"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const S={tab:'home',pay:[],users:[],lessons:[],live:[],papers:[],payF:'pending',batch:'all',q:''};
const TABS=[['home','🏠','Home'],['pay','💳','Payments'],['live','🔴','Live'],['users','👥','Students'],['lessons','📚','Lessons']];
const toast=m=>{const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=x=>{try{const d=x?.toDate?x.toDate():new Date(x);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return '—'}};
const empty=t=>`<div class="empty">${t}</div>`;
window.closeSheet=()=>$('sheet').classList.add('hidden');
const openSheet=h=>{$('sheetBody').innerHTML=h;$('sheet').classList.remove('hidden')};

window.doLogin=async()=>{
 const b=$('lb');b.disabled=true;b.textContent='Verifying...';
 try{
  const c=await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);
  const s=await getDoc(doc(db,'users',c.user.uid));
  if(!(s.exists()&&s.data().role==='admin')){await signOut(auth);toast('Admin කෙනෙක් නෙවෙයි ❌')}
 }catch(e){toast('Email හෝ Password වැරදියි')}
 b.disabled=false;b.textContent='Log in';
};
window.doLogout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){$('app').classList.add('hidden');$('login').classList.remove('hidden');return}
 const s=await getDoc(doc(db,'users',u.uid));
 if(!(s.exists()&&s.data().role==='admin'))return;
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('nav').innerHTML=TABS.map(t=>`<button id="n_${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
 go('home');
});
const list=async(c,o)=>{try{const s=await getDocs(o?query(collection(db,c),o):collection(db,c));return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){const s=await getDocs(collection(db,c));return s.docs.map(d=>({id:d.id,...d.data()}))}};
window.go=async t=>{
 S.tab=t;TABS.forEach(x=>$('n_'+x[0]).classList.toggle('on',x[0]===t));
 $('ttl').textContent=TABS.find(x=>x[0]===t)[2];
 $('main').innerHTML=empty('Loading...');
 try{
  if(t==='home'||t==='pay'){S.pay=await list('payments',orderBy('createdAt','desc'))}
  if(t==='home'||t==='users'){S.users=await list('users')}
  if(t==='home'||t==='lessons'||t==='pay'){S.lessons=await list('lessons')}
  if(t==='live'||t==='home'){S.live=await list('liveClasses',orderBy('scheduledAt','asc'))}
  if(t==='home'||t==='lessons'){S.papers=await list('quizPapers')}
 }catch(e){$('main').innerHTML=empty('Load වුණේ නෑ: '+esc(e.message));return}
 ({home,pay,live,users,lessons})[t]();
};
function home(){
 const pend=S.pay.filter(p=>p.status==='pending');
 const liveNow=S.live.filter(c=>c.status==='live').length;
 $('main').innerHTML=`<div class="grid">
  <div class="stat"><b>${S.users.length}</b><small>Students</small></div>
  <div class="stat"><b style="color:var(--warn)">${pend.length}</b><small>Pending payments</small></div>
  <div class="stat"><b>${S.lessons.length}</b><small>Lessons</small></div>
  <div class="stat"><b style="color:var(--bad)">${liveNow}</b><small>Live now</small></div></div>
  <h3>Recent payments</h3>${S.pay.slice(0,6).map(payCard).join('')||empty('Payments නෑ')}<div class="credit" style="margin-top:30px">App developed by <b>OMIDU DEWDITHA</b><br><a href="mailto:hello.omidu@gmail.com">hello.omidu@gmail.com</a></div>`;
}
const payCard=p=>`<div class="card" onclick="payOpen('${p.id}')"><div class="row"><div><div class="t">${esc(p.userName||'—')}</div><div class="m">${esc(p.itemTitle||'—')} • Rs. ${p.amount||0}</div></div><span class="pill ${p.status}">${p.status}</span></div></div>`;
function pay(){
 const F=['pending','approved','rejected','tute','all'];
 const f=S.payF;
 let l=f==='all'?S.pay:f==='tute'?S.pay.filter(p=>p.tuteRequested&&!p.tuteSent):S.pay.filter(p=>p.status===f);
 $('main').innerHTML=`<div class="chips">${F.map(x=>`<button class="${x===f?'on':''}" onclick="S.payF='${x}';pay()">${x==='tute'?'Tute pending':x}</button>`).join('')}</div>`+(l.map(payCard).join('')||empty('මොකුත් නෑ'));
}
window.S=S;window.pay=pay;
window.payOpen=id=>{
 const p=S.pay.find(x=>x.id===id);
 openSheet(`<div class="row"><div class="t" style="font-size:17px">${esc(p.userName)}</div><span class="pill ${p.status}">${p.status}</span></div>
 <div class="m">${esc(p.userEmail||'')} ${p.displayId?'• '+esc(p.displayId):''}</div>
 <div class="card" style="margin-top:12px"><div class="t">${esc(p.itemTitle)}</div><div class="m">Rs. ${p.amount||0} ${p.tuteRequested?'• Tute '+(p.tuteSent?'sent ✓':'requested'):''}</div><div class="m">${dt(p.createdAt)}</div></div>
 ${p.slipUrl?`<img class="slip" src="${esc(p.slipUrl)}" alt="slip">`:''}
 ${p.status==='pending'?`<div class="row"><button class="btn bad" onclick="payReject('${id}')">Reject</button><button class="btn ok" onclick="payApprove('${id}')">Approve</button></div>`:''}
 ${p.tuteRequested&&!p.tuteSent?`<button class="btn" style="margin-top:10px;background:#7c3aed;color:#fff" onclick="tuteSent('${id}')">📚 Tute Sent</button>`:''}`);
};
const notify=(uid,title,message,type,link)=>addDoc(collection(db,'users',uid,'notifications'),{title,message,type,link:link||null,read:false,createdAt:Timestamp.now()}).catch(()=>{});
window.payApprove=async id=>{
 const p=S.pay.find(x=>x.id===id);
 try{
  const us=await getDoc(doc(db,'users',p.userId));const u=us.exists()?us.data():{};
  if(p.type==='liveClass'){
   const paid=u.paidLiveClasses||[];if(!paid.includes(p.itemId))paid.push(p.itemId);
   await updateDoc(doc(db,'payments',id),{status:'approved',approvedAt:Timestamp.now()});
   await updateDoc(doc(db,'users',p.userId),{paidLiveClasses:paid});
   notify(p.userId,'Payment Approved! ✅',`"${p.itemTitle}" live class payment එක approve වුණා.`,'payment','classes.html');
  }else{
   const days=S.lessons.find(l=>l.id===p.itemId)?.expiryDays||30;
   const ex=new Date();ex.setDate(ex.getDate()+days);
   const en=u.enrolledLessons||[];en.push({lessonId:p.itemId,title:p.itemTitle,expiresAt:ex.toISOString()});
   await updateDoc(doc(db,'payments',id),{status:'approved',approvedAt:Timestamp.now()});
   await updateDoc(doc(db,'users',p.userId),{enrolledLessons:en});
   notify(p.userId,'Payment Approved! ✅',`"${p.itemTitle}" lesson payment එක approve වුණා. දින ${days}ක් access ලැබුණා.`,'payment','classes.html');
  }
  toast('Approved ✅');closeSheet();go('pay');
 }catch(e){toast('Error: '+e.message)}
};
window.payReject=async id=>{
 if(!confirm('Reject කරන්නද?'))return;
 const p=S.pay.find(x=>x.id===id);
 await updateDoc(doc(db,'payments',id),{status:'rejected'});
 if(p.userId)notify(p.userId,'Payment Rejected ❌',`"${p.itemTitle}" payment එක reject වුණා.`,'payment',null);
 toast('Rejected');closeSheet();go('pay');
};
window.tuteSent=async id=>{
 const p=S.pay.find(x=>x.id===id);
 await updateDoc(doc(db,'payments',id),{tuteSent:true});
 if(p.userId)notify(p.userId,'Tute Ready! 📚',`"${p.itemTitle}" tute එක send කරලා ඉවරයි.`,'paper',null);
 toast('Marked sent 📚');closeSheet();go('pay');
};
function live(){
 $('main').innerHTML=S.live.map(c=>`<div class="card"><div class="row"><div><div class="t">${esc(c.title)}</div><div class="m">${dt(c.scheduledAt)} • ${c.price>0?'Rs. '+c.price:'Free'}</div></div><span class="pill ${c.status}">${c.status}</span></div>
 <div class="row" style="margin-top:12px;justify-content:flex-start">
 ${c.status==='scheduled'?`<button class="btn ok sm" onclick="liveSet('${c.id}','live')">Go Live</button>`:''}
 ${c.status==='live'?`<button class="btn bad sm" onclick="liveSet('${c.id}','completed')">End</button>`:''}
 <button class="btn ghost sm" onclick="liveDel('${c.id}')">Delete</button></div></div>`).join('')||empty('Live classes නෑ (අලුත් ඒවා web admin එකෙන් schedule කරන්න)');
}
window.liveSet=async(id,st)=>{
 if(!confirm(st==='live'?'Go live now?':'End live class?'))return;
 const c=S.live.find(x=>x.id===id);
 await updateDoc(doc(db,'liveClasses',id),{status:st});
 if(st==='live'){const us=await getDocs(collection(db,'users'));us.forEach(u=>notify(u.id,'🔴 Live Class Started!',`"${c.title}" දැන් live!`,'class','classes.html'))}
 toast('Updated');go('live');
};
window.liveDel=async id=>{if(!confirm('Delete?'))return;await deleteDoc(doc(db,'liveClasses',id));go('live')};
function users(){
 const B=['all','2026','2027','2028'];
 let l=S.users.filter(u=>(S.batch==='all'||u.batch===S.batch)&&`${u.firstName} ${u.lastName} ${u.email} ${u.phone} ${u.displayId||''}`.toLowerCase().includes(S.q));
 $('main').innerHTML=`<input id="sq" placeholder="🔍 Search name / phone / email" value="${esc(S.q)}" oninput="S.q=this.value.toLowerCase();usersList()">
 <div class="chips">${B.map(b=>`<button class="${b===S.batch?'on':''}" onclick="S.batch='${b}';users()">${b==='all'?'All':b+' A/L'}</button>`).join('')}</div><div id="ul"></div>`;
 usersList();
}
window.users=users;
window.usersList=()=>{
 const l=S.users.filter(u=>(S.batch==='all'||u.batch===S.batch)&&`${u.firstName} ${u.lastName} ${u.email} ${u.phone} ${u.displayId||''}`.toLowerCase().includes(S.q));
 $('ul').innerHTML=`<h3>${l.length} students</h3>`+(l.slice(0,80).map(u=>`<div class="card"><div class="row"><div><div class="t">${esc(u.firstName)} ${esc(u.lastName)} ${u.role==='admin'?'⭐':''}</div><div class="m">${esc(u.phone||'')} • ${esc(u.batch||'')}</div></div>${u.phone?`<a href="tel:${esc(u.phone)}" class="btn ghost sm" style="text-decoration:none;text-align:center">📞</a>`:''}</div></div>`).join('')||empty('Students නෑ'));
};
function lessons(){
 $('main').innerHTML=`<h3>Lessons (${S.lessons.length})</h3>`+S.lessons.sort((a,b)=>(a.order||0)-(b.order||0)).map(l=>`<div class="card"><div class="t">${esc(l.title)}</div><div class="m">${esc(l.batch||'')} • Rs. ${l.price||0} • ${l.expiryDays||30} days</div></div>`).join('')
 +`<h3 style="margin-top:18px">Quiz papers (${S.papers.length})</h3>`+(S.papers.map(p=>`<div class="card"><div class="t">${esc(p.title)}</div><div class="m">${esc(p.batch||'')}</div></div>`).join('')||empty('Papers නෑ'));
}
</script>
</body></html>
